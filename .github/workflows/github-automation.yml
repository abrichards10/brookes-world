name: GitHub Automation

# Ported from the Qurrent supervisor-ui: on every push to a non-main branch,
# maintain an AI-generated changelog in that branch's pull request body.
# tools/pr_automation.js finds/creates the PR, diffs new commits since the
# last processed SHA, and pipes them to tools/ai_changelog.js (OpenAI) which
# summarizes them into deduped, noise-filtered bullets inside a managed
# "## Changes" block.
#
# Requires an OPENAI_API_KEY repository secret. Nothing runs on direct pushes
# to main (the changelog lives in the PR).

on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: github-automation-${{ github.ref_name }}
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-5-2025-08-07

jobs:
  on-push:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update changelog for branch
        run: |
          node tools/pr_automation.mjs --branch "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
